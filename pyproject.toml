[project]
name = "energy-ops-hub"
version = "0.1.0"
description = "Automatización de operaciones energéticas para carteras inmobiliarias"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "httpx>=0.28",
    "openai>=3.45.0",
    "pdfplumber>=0.11.10",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.33",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pyyaml>=6.0.3",
    "reportlab>=5.1.0",
    "respx>=0.22",
    "ruff>=0.8",
    "types-pyyaml>=6.0.12.20261103",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests", "scripts", "migrations", "evals"]
# ruff 0.17 formatea código dentro de Markdown: la spec y los documentos ODD se
# versionan literalmente, sin reformatear, así que quedan fuera.
extend-exclude = ["docs", "odd"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PT"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]
"tests/*.py" = ["S101"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
files = ["app", "scripts", "tests", "evals"]
# scripts/ es un namespace package (sin __init__.py): sin esta opción mypy resuelve
# scripts/seed.py como "seed" y "scripts.seed" a la vez y aborta.
explicit_package_bases = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["pdfplumber.*", "anthropic.*", "reportlab.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["integration: tests que necesitan PostgreSQL real"]
